# config options for mesh_gen_simmetrix test case
# Uses Simmetrix generate2dModel instead of Jigsaw
[mesh]

# Mesh generator: 'jigsaw' or 'simmetrix'
mesh_generator = simmetrix

# Simmetrix-specific parameters
# Path to generate2dModel binary (default: 'generate2dModel' assumes it's in PATH)
# Uncomment and set full path if binary is not in PATH:
# simmetrix_binary = /path/to/generate2dModel

# Minimum allowed distance between adjacent vertices (meters)
simmetrix_coincident_tolerance = 1.0
# Upper bound for determining if a vertex should be treated as a model vertex
simmetrix_angle_tolerance = 100.0
# Upper bound on angle between adjacent edges to determine if part of same curve
simmetrix_oncurve_angle_tolerance = 100.0
# Units for coordinates: 'm' (meters) or 'km' (kilometers)
simmetrix_units = m

# number of levels in the mesh
levels = 10

# Bounds of GIS mesh. If any bound is set
# to None, the mesh will use the full extent
# of the gridded dataset.
x_min = None
x_max = None
y_min = None
y_max = None

# distance from ice margin to cull (km).
# Set to a value <= 0 if you do not want
# to cull based on distance from margin.
cull_distance = 10.0

# number of processors to use for ESMF_RegridWeightGen
nProcs = 128

# mesh density parameters
# minimum cell spacing (meters)
min_spac = 3.e3
# maximum cell spacing (meters)
max_spac = 30.e3
# log10 of max speed for cell spacing
high_log_speed = 2.5
# log10 of min speed for cell spacing
low_log_speed = 0.75
# distance at which cell spacing = max_spac
high_dist = 1.e5
# distance within which cell spacing = min_spac
low_dist = 1.e4
# distance at which bed topography has no effect
high_dist_bed = 1.e5
# distance within which bed topography has maximum effect
low_dist_bed = 7.5e4
# Bed elev beneath which cell spacing is minimized
low_bed = 50.0
# Bed elev above which cell spacing is maximized
high_bed = 100.0

# mesh density functions
use_speed = True
use_dist_to_grounding_line = False
use_dist_to_edge = True
use_bed = True

[greenland]
# path to directory containing BedMachine and Measures datasets
# (default value is for Perlmutter)
data_path = /global/cfs/cdirs/fanssie/standard_datasets/GIS_datasets/

# geojson used to create the cull mask in mesh generation
geojson_filename = greenland_only_outline_45km_buffer_latlon_singlepart.geojson

# filename of the BedMachine thickness and bedTopography dataset
# (default value is for Perlmutter)
bedmachine_filename = BedMachineGreenland-v6_edits_floodFill_extrap.nc

# filename of the MEaSUREs ice velocity dataset
# (default value is for Perlmutter)
measures_filename = greenland_vel_mosaic500_extrap.nc

# projection of the source datasets, according to the dictionary keys
# create_scrip_file_from_planar_rectangular_grid from MPAS_Tools
src_proj = gis-gimp

# number of processors to use for ESMF_RegridWeightGen
nProcs = 128
